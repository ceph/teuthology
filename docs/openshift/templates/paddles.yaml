apiVersion: apps/v1
kind: Deployment
metadata:
  name: paddles
  labels:
    app: paddles
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paddles
  template:
    metadata:
      labels:
        app: paddles
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h paddles-postgres -U paddles -d paddles; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: paddles
          image: {{ .Values.paddles.image }}
          ports:
            - containerPort: 8080
          env:
            - name: PADDLES_SERVER_HOST
              value: "0.0.0.0"
            - name: PADDLES_SQLALCHEMY_URL
              value: postgresql+psycopg2://paddles:{{ .Values.postgres.password }}@paddles-postgres:5432/paddles
            - name: PADDLES_JOB_LOG_HREF_TEMPL
              value: {{ .Values.paddles.jobLogHrefTempl | quote }}
            - name: PADDLES_WORKER_COUNT
              value: {{ .Values.paddles.workerCount | quote }}
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paddles
  labels:
    app: paddles
spec:
  selector:
    app: paddles
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: paddles
  labels:
    app: paddles
spec:
  to:
    kind: Service
    name: paddles
  port:
    targetPort: 8080
