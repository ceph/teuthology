# Tenant NetworkPolicy internal-1 only allows the internal-router-shard.
# Routes in this cluster are admitted by the default ingresscontroller, so
# allow all pods from openshift-ingress (and the standard ingress policy-group).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openshift-ingress
  labels:
    app: teuthology
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - namespaceSelector:
            matchLabels:
              name: openshift-ingress
