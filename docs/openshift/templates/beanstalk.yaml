apiVersion: apps/v1
kind: Deployment
metadata:
  name: beanstalk
  labels:
    app: beanstalk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beanstalk
  template:
    metadata:
      labels:
        app: beanstalk
    spec:
      containers:
        - name: beanstalk
          image: {{ .Values.beanstalk.image }}
          ports:
            - containerPort: 11300
          env:
            - name: BEANSTALK_ADDR
              value: "0.0.0.0"
            - name: BEANSTALK_PORT
              value: "11300"
          readinessProbe:
            tcpSocket:
              port: 11300
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 11300
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: beanstalk
  labels:
    app: beanstalk
spec:
  type: {{ .Values.beanstalk.serviceType | default "LoadBalancer" }}
  selector:
    app: beanstalk
  ports:
    - name: beanstalk
      port: 11300
      targetPort: 11300
