apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: paddles-postgres
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paddles-postgres-data
  labels:
    app: paddles-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paddles-postgres
  labels:
    app: paddles-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paddles-postgres
  template:
    metadata:
      labels:
        app: paddles-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: paddles
            - name: POSTGRES_DB
              value: paddles
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - paddles
                - -d
                - paddles
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - paddles
                - -d
                - paddles
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paddles-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: paddles-postgres
  labels:
    app: paddles-postgres
spec:
  selector:
    app: paddles-postgres
  ports:
    - port: 5432
      targetPort: 5432
