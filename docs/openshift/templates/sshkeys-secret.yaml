{{- /*
  Lab SSH key material from teuthology.users[].sshKey, embedded into the
  teuthology VM via cloud-init (and available as Secret teuthology-lab-ssh).
*/ -}}
{{- $users := .Values.teuthology.users | default list }}
{{- $labPriv := include "teuthology.usersLabPrivateKey" $users }}
{{- $labPub := include "teuthology.usersLabPublicKeyPrimary" $users }}
{{- $labPubs := include "teuthology.usersLabPublicKeys" $users }}
{{- if or $labPriv $labPub }}
apiVersion: v1
kind: Secret
metadata:
  name: teuthology-lab-ssh
  labels:
    app: teuthology
type: Opaque
stringData:
{{- if $labPriv }}
  id_ed25519: |
{{ $labPriv | nindent 4 }}
{{- end }}
{{- if $labPub }}
  id_ed25519.pub: {{ $labPub | quote }}
{{- end }}
{{- if $labPubs }}
  authorized_keys: |
{{ $labPubs | nindent 4 }}
{{- end }}
{{- end }}
