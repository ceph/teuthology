{{- /*
  Dual-NIC KubeVirt VM: single teuthology node (CLI + dispatcher + archive).
  Masquerade reaches paddles/beanstalk; UDN reaches target-*.<labDomain>.
*/ -}}
{{- if .Values.teuthology.enabled | default true }}
{{- $vmName := .Values.teuthology.name | default "teuthology" }}
{{- $users := .Values.teuthology.users | default list }}
{{- $sshUser := include "teuthology.loginName" $users }}
{{- $password := include "teuthology.loginPassword" $users }}
{{- $labPubs := include "teuthology.usersLabPublicKeys" $users }}
{{- $sshPriv := include "teuthology.usersLabPrivateKey" $users }}
{{- $sshPubPrimary := include "teuthology.usersLabPublicKeyPrimary" $users }}
{{- $archivePort := .Values.archive.port | default 8080 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $vmName }}-cloudinit
  labels:
    app: teuthology
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: {{ $vmName }}
    manage_etc_hosts: true
    disable_root: false
    ssh_pwauth: true
    # cc_ssh_authkey_fingerprints is cosmetic (logs fingerprints to console)
    # and truncates ~/.ssh/authorized_keys to empty on this Fedora/cloud-init
    # combo; disable it so the per-user authorizedKeys below actually stick.
    no_ssh_fingerprints: true
    users:
{{- range $users }}
{{- $uname := .sshUser | default .name | default "teuthology" }}
      - name: {{ $uname | quote }}
        sudo: ALL=(root) NOPASSWD:ALL
        shell: /bin/bash
        lock_passwd: false
        plain_text_passwd: {{ .password | default "passwd" | quote }}
        ssh_authorized_keys:
{{- range .authorizedKeys | default list }}
{{- if . }}
          - {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
    chpasswd:
      expire: false
      users:
{{- range $users }}
{{- $uname := .sshUser | default .name | default "teuthology" }}
        - name: {{ $uname | quote }}
          password: {{ .password | default "passwd" | quote }}
          type: text
{{- end }}
        - name: root
          password: {{ $password | quote }}
          type: text
    write_files:
      - path: /etc/teuthology.yaml
        permissions: "0644"
        content: |
{{ tpl (.Files.Get "files/teuthology/teuthology.yaml") . | trim | indent 10 }}
{{- if $labPubs }}
      - path: /etc/teuthology/lab_ssh_authorized_keys
        permissions: "0644"
        content: |
{{ $labPubs | nindent 10 }}
{{- end }}
{{- if $sshPriv }}
      - path: /etc/teuthology/ssh/id_ed25519
        permissions: "0600"
        content: |
{{ $sshPriv | nindent 10 }}
{{- end }}
{{- if $sshPubPrimary }}
      - path: /etc/teuthology/ssh/id_ed25519.pub
        permissions: "0644"
        content: {{ $sshPubPrimary | quote }}
{{- end }}
      - path: /usr/local/sbin/teuthology-udn-client.sh
        permissions: "0755"
        content: |
{{ tpl (.Files.Get "files/teuthology/teuthology-udn-client.sh") . | indent 10 }}
      - path: /usr/local/sbin/teuthology-bootstrap.sh
        permissions: "0755"
        content: |
{{ tpl (.Files.Get "files/teuthology/teuthology-bootstrap.sh") . | indent 10 }}
      - path: /etc/systemd/system/teuthology-udn-client.service
        permissions: "0644"
        content: |
{{ .Files.Get "files/teuthology/teuthology-udn-client.service" | indent 10 }}
      - path: /etc/systemd/system/teuthology-bootstrap.service
        permissions: "0644"
        content: |
{{ .Files.Get "files/teuthology/teuthology-bootstrap.service" | indent 10 }}
      - path: /etc/systemd/system/teuthology-dispatcher.service
        permissions: "0644"
        content: |
{{ tpl (.Files.Get "files/teuthology/teuthology-dispatcher.service") . | indent 10 }}
      - path: /etc/systemd/system/teuthology-archive.service
        permissions: "0644"
        content: |
{{ tpl (.Files.Get "files/teuthology/teuthology-archive.service") . | indent 10 }}
    package_update: false
    package_upgrade: false
    runcmd:
      - timedatectl set-timezone Etc/UTC || true
      - systemctl daemon-reload
      - systemctl enable --now teuthology-udn-client.service
      - systemctl enable --now teuthology-bootstrap.service
      - systemctl enable teuthology-archive.service
      - systemctl enable teuthology-dispatcher.service
    final_message: "teuthology node ready (CLI + dispatcher + archive; bootstrap may still be running)"
---
apiVersion: pool.kubevirt.io/v1alpha1
kind: VirtualMachinePool
metadata:
  name: {{ $vmName }}
  labels:
    app: teuthology
spec:
  replicas: {{ .Values.teuthology.replicas | default 1 }}
  selector:
    matchLabels:
      app: teuthology
  virtualMachineTemplate:
    metadata:
      labels:
        app: teuthology
    spec:
      runStrategy: Always
{{- $rootDisk := .Values.teuthology.rootDisk | default dict }}
{{- $rootName := $rootDisk.name | default (printf "%s-root" $vmName) }}
{{- $gwRoot := .Values.dhcpGateway.rootDisk | default dict }}
      dataVolumeTemplates:
        - metadata:
            name: {{ $rootName }}
          spec:
            sourceRef:
              kind: DataSource
              name: {{ .Values.teuthology.dataSource.name | default .Values.dhcpGateway.dataSource.name | default "fedora" }}
              {{- $dsNs := .Values.teuthology.dataSource.namespace | default .Values.dhcpGateway.dataSource.namespace }}
              {{- if $dsNs }}
              namespace: {{ $dsNs }}
              {{- end }}
            storage:
              accessModes:
                - {{ $rootDisk.accessMode | default $gwRoot.accessMode | default "ReadWriteMany" }}
              volumeMode: Filesystem
              {{- $sc := $rootDisk.storageClassName | default .Values.teuthology.storageClassName | default $gwRoot.storageClassName | default .Values.dhcpGateway.storageClassName }}
              {{- if $sc }}
              storageClassName: {{ $sc }}
              {{- end }}
              resources:
                requests:
                  storage: {{ $rootDisk.size | default .Values.teuthology.rootDiskSize | default "40Gi" }}
      template:
        metadata:
          labels:
            app: teuthology
        spec:
          domain:
            cpu:
              cores: {{ .Values.teuthology.cores | default 4 }}
            memory:
              guest: {{ .Values.teuthology.memory | default "8Gi" | quote }}
            resources:
              requests:
                cpu: {{ .Values.teuthology.cores | default 4 | quote }}
                memory: {{ .Values.teuthology.memory | default "8Gi" | quote }}
              limits:
                cpu: {{ .Values.teuthology.cores | default 4 | quote }}
                memory: {{ .Values.teuthology.memory | default "8Gi" | quote }}
            devices:
              disks:
                - name: rootdisk
                  bootOrder: 1
                  disk:
                    bus: virtio
{{- range .Values.teuthology.dataVolumes | default list }}
{{- $volName := .name | trim }}
{{- $serial := $volName | replace "-" "" | trunc 20 }}
                - name: {{ $volName }}
                  serial: {{ $serial | quote }}
                  disk:
                    bus: virtio
{{- end }}
                - name: cloudinitdisk
                  disk:
                    bus: virtio
              interfaces:
                - name: default
                  masquerade: {}
                - name: {{ .Values.udn.name }}
                  macAddress: {{ .Values.teuthology.mac | quote }}
                  binding:
                    name: l2bridge
          networks:
            - name: default
              pod: {}
            - name: {{ .Values.udn.name }}
              multus:
                networkName: {{ .Values.udn.name }}
          volumes:
            - name: cloudinitdisk
              cloudInitNoCloud:
                secretRef:
                  name: {{ $vmName }}-cloudinit
            - name: rootdisk
              dataVolume:
                name: {{ $rootName }}
{{- range .Values.teuthology.dataVolumes | default list }}
{{- $volName := .name | trim }}
            - name: {{ $volName }}
              persistentVolumeClaim:
                claimName: {{ $volName }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $vmName }}
  labels:
    app: teuthology
spec:
  type: LoadBalancer
  selector:
    app: teuthology
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
    - name: archive
      protocol: TCP
      port: {{ $archivePort }}
      targetPort: {{ $archivePort }}
{{- end }}
