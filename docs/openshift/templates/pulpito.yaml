apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulpito
  labels:
    app: pulpito
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulpito
  template:
    metadata:
      labels:
        app: pulpito
    spec:
      initContainers:
        - name: wait-for-paddles
          image: curlimages/curl
          command:
            - sh
            - -c
            - |
              until curl -sf http://paddles:8080; do
                echo "waiting for paddles..."
                sleep 2
              done
      containers:
        - name: pulpito
          image: {{ .Values.pulpito.image }}
          ports:
            - containerPort: 8081
          env:
            - name: PULPITO_PADDLES_ADDRESS
              value: http://paddles:8080
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pulpito
  labels:
    app: pulpito
spec:
  selector:
    app: pulpito
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: pulpito
  labels:
    app: pulpito
spec:
  to:
    kind: Service
    name: pulpito
  port:
    targetPort: 8081
