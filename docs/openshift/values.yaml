# Environment-specific settings. Copy or edit before deploy.
#
# Single teuthology node VM runs: CLI + teuthology-dispatcher + archive HTTP.
# Pods remaining: paddles, pulpito, beanstalk, postgres.

# App images default to quay.io/ceph-infra.
# Override any *.image to use a different registry, tag, or locally built image.

# All disks/DataVolumes in this file (dataSources, rootDisk, dataVolumes) need
# a StorageClass that supports ReadWriteMany. Set an explicit storageClassName
# per entry (or on teuthology.rootDisk) if the cluster has no default RWX class.
dataSources:
  - name: fedora
    url: https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
    size: 15Gi
    accessMode: ReadWriteMany
    # storageClassName: <rwx-storage-class>
  - name: centos-9.stream
    url: https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2
    size: 15Gi
    accessMode: ReadWriteMany
  - name: rocky-10
    url: https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2
    size: 15Gi
    accessMode: ReadWriteMany
  - name: ubuntu-22.04
    url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
    size: 15Gi
    accessMode: ReadWriteMany
  - name: ubuntu-24.04
    url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    size: 15Gi
    accessMode: ReadWriteMany

# Multus network for the teuthology node (secondary NIC) and for lock guests
# (openshift.udn_name). Guests use a *single* Multus NIC — no pod/masquerade
# (ceph tracker #80437). Lab DHCP/DNS must map paddles mac_address → hostname → IP.
udn:
  name: <lab-front-network>
  # Resolvers for dispatcher.labDomain on the Multus NIC (split DNS).
  # dnsServers:
  #   - 10.0.0.1

postgres:
  image: quay.io/ceph-infra/teuthology-postgresql:latest
  password: secret
  storage: 100Gi

paddles:
  image: quay.io/ceph-infra/paddles:latest
  workerCount: "4"
  # In-cluster Service DNS works for paddles→archive (Service → teuthology VM).
  jobLogHrefTempl: http://archive/{run_name}/{job_id}/teuthology.log

pulpito:
  image: quay.io/ceph-infra/pulpito:latest

beanstalk:
  image: quay.io/ceph-infra/teuthology-beanstalkd:latest
  serviceType: LoadBalancer

# Archive HTTP runs on the teuthology node (python http.server).
archive:
  port: 8080
  path: /home/teuthology/archive

# Queue / lab settings used by teuthology.yaml and teuthology-dispatcher on the node.
# Do not set enabled=true — dispatcher runs on the teuthology VM, not a separate Deployment.
dispatcher:
  tube: ocpvirt
  labDomain: ocpvirt.local
  path:
    src: /home/teuthology/src
    archive: /home/teuthology/archive

# Single node: CLI + dispatcher + archive.
teuthology:
  name: teuthology-dev
  dataSource:
    name: fedora
  replicas: 1
  cores: 4
  memory: 8Gi
  rootDisk:
    # name defaults to "<teuthology.name>-root" when omitted.
    size: 40Gi
    accessMode: ReadWriteMany
    # storageClassName: <rwx-storage-class>
  dataVolumes:
    - name: teuthology-dev
      size: 100Gi
      accessMode: ReadWriteMany
      path: /home/teuthology
      # storageClassName: <rwx-storage-class>  # defaults to rootDisk.storageClassName
  # Multus NIC MAC (must match lab DHCP reservation for this node).
  mac: "52:54:00:d4:c9:09"
  # Lab keypair (users[].sshKey) is what the teuthology node uses to reach
  # ocpvirt* guests. Do NOT commit a real private key here. Leave sshKey unset
  # to let teuthology-udn-client.sh generate one on first boot, or generate
  # your own and paste it in (never reuse this chart's git history for keys):
  #   ssh-keygen -t ed25519 -N '' -f ./lab_id_ed25519
  users:
    - name: teuthology
      sshUser: teuthology
      password: passwd
      # sshKey:
      #   publicKey: ssh-ed25519 AAAA... teuthology@lab
      #   privateKey: |
      #     -----BEGIN OPENSSH PRIVATE KEY-----
      #     ...
      #     -----END OPENSSH PRIVATE KEY-----
      authorizedKeys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINJCftd/vE1dq39ksssXR9RJOxXdOcRWpiZsdDzoJDYf teuthology-user
  git:
    url: https://github.com/ceph/teuthology.git
    # Branch must include the OpenShift provisioner (teuthology/provision/openshift.py)
    # and teuthology/ocp/user_data templates before lock/reimage will work.
    branch: main

# Written into /etc/teuthology.yaml on the teuthology node for the OpenShift
# provisioner. Do not commit tokens. user_data templates are cloud-init only;
# disks / DataSources / guest SSH keys come from the fields below.
#
# Defaults assume chart-local dataSources in the release namespace. To use
# cluster images instead, set datasource_namespace (e.g.
# openshift-virtualization-os-images) and remap datasources to those object
# names (centos may be centos-stream9 rather than centos-9.stream).
openshift:
  # server: https://api.example.com:6443
  # token: ""
  # certificate_authority_data: ""
  # insecure_skip_tls_verify: false
  # root_storage_class: <rwx-storage-class>   # falls back to teuthology.rootDisk.storageClassName
  # data_storage_class: <rwx-storage-class>   # defaults to root_storage_class
  # datasource_namespace: ""                  # defaults to the release namespace
  # udn_binding: l2bridge
  # vcpus: 4
  # ram: 8Gi
  # root_storage_size: 40Gi
  # timeout: 900
  # Guest SSH pubs (provisioner injects into cloud-init). When unset, the chart
  # uses teuthology.users[].sshKey.publicKey; if that is also unset,
  # teuthology-udn-client writes the first-boot generated pubkey into
  # /etc/teuthology.yaml.
  # ssh_authorized_keys:
  #   - ssh-ed25519 AAAA... teuthology@lab
  datasources:
    ubuntu/22.04: ubuntu-22.04
    ubuntu/24.04: ubuntu-24.04
    rocky/10: rocky-10
    centos/9.stream: centos-9.stream
  # Extra blank disks on every lock guest ([] = root disk only; key required).
  volumes: []
